<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101521">
<meta name="description" content="Flappy Barber — אבי וקוקו עפים בין עמודי מספרה. בוחרים דמות, מקישים ומנסים לשבור שיא!">
<meta property="og:title" content="Flappy Barber — אבי × קוקו">
<title>Flappy Barber | אבי × קוקו</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:dark;--dark:#101521;--gold:#f5c876;--cream:#fff6e7;--muted:#b3b6c6;--border:#ffffff1a;--red:#ed6161;--teal:#56b7bb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overscroll-behavior:none;background:var(--dark);overflow:hidden}body{color:var(--cream);-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.5;cursor:default}#app{height:100%;height:100dvh;width:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse 75% 34% at 5% 4%,#70372b68,transparent),radial-gradient(ellipse 76% 34% at 94% 5%,#18396480,transparent),#101521}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
/* Opening: bold classic arcade styling, two giant barber characters */
#home .head{position:absolute;top:0;left:0;right:0;z-index:7;padding:calc(10px + env(safe-area-inset-top)) 16px 0;max-width:600px;margin:auto}
.topline{height:43px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:950;white-space:nowrap}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#fff1c3,#d39e4b);color:#292131;display:grid;place-items:center;box-shadow:0 5px 22px #e6aa5633;font-size:23px}
.brand small{font-size:9px;display:block;letter-spacing:2.2px;color:var(--gold);direction:ltr;text-align:right;font-weight:900}
.top-quick{display:flex;gap:6px}.top-quick button{color:#fff4e5;background:#ffffff10;border:1px solid #ffffff24;border-radius:50px;min-height:36px;padding:0 10px;font-weight:800;font-size:12px}
.intro{text-align:center;margin-top:13px}.intro .overline{color:var(--gold);letter-spacing:2px;font-weight:900;font-size:10px}.intro h1{font-size:clamp(30px,8.8vw,46px);letter-spacing:-1.4px;margin:2px 0 0;line-height:1.1;font-weight:1000}.intro h1 strong{color:var(--gold)}.intro p{color:#d9d6d7;font-size:13px;line-height:1.25;margin:7px 0 10px}
.start{background:linear-gradient(180deg,#f66d5b,#c7333e);color:white;border:0;box-shadow:0 10px 25px #d7384450,inset 0 1px 1px #fff9;border-radius:17px;width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:1000;text-shadow:0 2px #8e262f;transition:transform .1s}.start:active{transform:scale(.98)}.hintline{text-align:center;color:#f4d69e;font-size:12px;font-weight:850;margin-top:9px;letter-spacing:.1px}
.hero-split{position:absolute;top:calc(env(safe-area-inset-top) + 250px);bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.hero{border:0;min-width:0;padding:0;color:white;position:relative;overflow:hidden;isolation:isolate;text-align:center;background:radial-gradient(ellipse 100% 47% at 50% 32%,#e8b97633,transparent),linear-gradient(160deg,#19434f,#102a36 67%,#0a111b);box-shadow:inset 0 0 0 1px #fff2}
.hero.koko{background:radial-gradient(ellipse 120% 50% at 50% 33%,#f0ac8330,transparent),linear-gradient(155deg,#50323e,#272038 68%,#131421)}
.hero::after{content:"";position:absolute;inset:50% 0 0;z-index:4;pointer-events:none;background:linear-gradient(transparent 30%,#060b17d9)}
.hero[data-selected="true"]{box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 35px #f9d08520}
.hero .glow{position:absolute;width:140%;height:55%;top:0;left:-20%;background:radial-gradient(ellipse at center,#ffffff20,transparent 70%)}
.hero .wing{position:absolute;z-index:1;top:42%;left:50%;width:78%;height:31%;background:linear-gradient(140deg,#faeecb,#e7bc7c);border-radius:70% 12% 70% 12%;transform-origin:85% 35%;transform:translate(-94%,-9%) rotate(-20deg);box-shadow:inset 0 0 0 7px #fff3,0 10px 23px #0005;animation:wing 1s ease-in-out infinite alternate}.hero .wing.right{transform:translate(-5%,-10%) scaleX(-1) rotate(-18deg);animation:wingRight 1s ease-in-out infinite alternate}
.hero .body{position:absolute;z-index:2;left:50%;top:47%;width:69%;height:45%;transform:translateX(-50%);background:linear-gradient(135deg,#368580,#17505b 70%);border:2px solid #fff2;border-radius:39% 39% 16% 16%}.hero.koko .body{background:linear-gradient(130deg,#324e86,#162b51)}
.hero .shirt{position:absolute;top:8%;left:34%;width:32%;height:43%;background:#fbf7ec;clip-path:polygon(0 0,100% 0,50% 100%)}.hero .tie{position:absolute;top:10%;left:46%;height:37%;width:9%;background:#f0c875;clip-path:polygon(50% 0,100% 13%,65% 100%,24% 100%,0 13%)}.hero.koko .tie{background:#e64a51}
.hero .face{position:absolute;z-index:3;top:4%;left:50%;transform:translateX(-50%);width:116%;height:58%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 12px 10px #0007)}.hero.avi .face{top:6%;height:54%;width:118%}.hero.koko .face{top:2%;height:58%;width:112%}
.hero .label{position:absolute;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 24px);right:0;left:0;text-shadow:0 4px 10px #000}.hero .label strong{display:block;font-size:clamp(41px,12vw,62px);font-weight:1000;line-height:1.1}.hero .label small{font-size:13px;font-weight:800;color:#f8e9d0}.hero .check{position:absolute;top:14px;right:11px;width:31px;height:31px;border-radius:50%;background:var(--gold);color:#242021;z-index:8;display:grid;place-items:center;font-weight:950;opacity:0;transform:scale(.55);transition:.15s}.hero[data-selected="true"] .check{opacity:1;transform:scale(1)}
@keyframes wing{to{transform:translate(-94%,-18%) rotate(-35deg)}}@keyframes wingRight{to{transform:translate(-5%,-18%) scaleX(-1) rotate(-35deg)}}
/* Gameplay canvas */
#game{background:#151c2a;touch-action:none}#world{width:100%;height:100%;display:block;touch-action:none}#game:after{content:"";pointer-events:none;position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,#0d142f77 0,transparent 26%,transparent 75%,#0d142c65)}
.hud{pointer-events:none;position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 12px);right:12px;left:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.hud .stats{display:flex;gap:7px}.stats .stat{min-width:70px;text-align:center;background:#101724d9;border:1px solid #ffffff2c;box-shadow:0 4px 18px #0004;border-radius:15px;padding:7px 11px;backdrop-filter:blur(12px)}.stats .stat b{font-weight:1000;font-size:24px;display:block;color:#ffda8a;line-height:1.1;font-variant-numeric:tabular-nums}.stats .stat small{display:block;font-size:10px;color:#c0bdc7;font-weight:700;margin-top:3px}
.hud button{pointer-events:auto;min-width:41px;height:42px;border:1px solid #ffffff36;background:#111929da;color:#fff5e7;border-radius:15px;font-size:19px;font-weight:950}.hint{z-index:4;position:absolute;top:calc(env(safe-area-inset-top) + 91px);right:12px;left:12px;background:#101727b6;backdrop-filter:blur(11px);border:1px solid #ffffff18;border-radius:25px;padding:9px 12px;text-align:center;font-weight:800;font-size:12px;color:#fcf2dd;pointer-events:none;transition:opacity .2s}.hint.fade{opacity:0}
.tapcall{pointer-events:none;z-index:4;position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);right:15px;left:15px;text-align:center;background:#111a29bc;border:1px solid #ffffff22;border-radius:20px;color:#ffe2a5;padding:12px;font-weight:900;font-size:15px;transition:opacity .2s}.tapcall.fade{opacity:0}
/* Results, help, and pause */
.overlay{position:absolute;z-index:30;inset:0;background:#050913bb;display:none;align-items:center;justify-content:center;padding:17px;backdrop-filter:blur(9px)}.overlay.open{display:flex}.dialog{width:min(100%,400px);border:1px solid #f6d3854d;background:radial-gradient(ellipse at 55% 0%,#4e3543,#1a2335 63%,#121823);border-radius:24px;padding:25px 20px;box-shadow:0 22px 85px #000c;text-align:center;color:#fff5df}.dialog .art{font-size:51px;line-height:1.2}.dialog h2{font-size:29px;line-height:1.1;margin:9px 0 6px}.dialog p{font-size:14px;color:#d8d6dd;margin:8px 0 14px;line-height:1.55}.dialog .scorebig{font-size:57px;line-height:1.1;font-weight:1000;color:var(--gold)}.dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.dialog .row span{border:1px solid #ffffff20;border-radius:13px;padding:10px 5px;font-size:12px;color:#c0bfd0}.dialog .row b{display:block;color:white;font-size:23px}.dialog button{border:0;border-radius:15px;min-height:52px;width:100%;font-weight:950;font-size:16px;margin:4px 0;background:#ee6154;color:#fff}.dialog button.secondary{background:#ffffff12;color:white;border:1px solid #ffffff30}.dialog .note{color:#f4d492;font-size:12px}
@media(max-height:730px){.hero-split{top:calc(env(safe-area-inset-top) + 225px)}.intro{margin-top:6px}.intro h1{font-size:32px}.intro p{margin:4px 0 6px}.start{min-height:48px;font-size:19px}.hintline{margin-top:5px}.hero .label{bottom:calc(env(safe-area-inset-bottom) + 12px)}}
@media(max-height:640px){.hero-split{top:calc(env(safe-area-inset-top) + 208px)}.topline{height:38px}.intro h1{font-size:27px}.intro .overline{font-size:9px}.intro p{font-size:11px}.start{min-height:44px;font-size:18px}.hintline{font-size:11px;margin-top:3px}}
@media(min-width:610px){#home .head{max-width:590px}.hero-split{max-width:610px;margin:auto}.start{max-width:500px;margin:auto}}
@media(prefers-reduced-motion:reduce){.hero .wing{animation:none}}
.bc-remove-inline{display:inline-flex;align-items:center;justify-content:center;margin-inline-start:7px;padding:3px 10px;min-height:29px;border:1px solid #f8d0858c;border-radius:99px;background:#f7d18c25;color:#ffe1a9;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}
@media(max-width:345px){.bc-remove-inline{margin-inline-start:3px;padding-inline:6px;font-size:10px}}
</style>

<body>
<div id="app">
<section id="home" class="screen active" aria-label="בחירת דמות Flappy Barber">
  <header class="head">
    <div class="topline"><div class="brand"><span class="logo" aria-hidden="true">✂️</span><span>אבי × קוקו<small>FLAPPY BARBER</small></span></div><div class="top-quick"><button id="helpBtn" type="button">? איך משחקים</button><button id="audioBtn" type="button" aria-label="הפעלת וכיבוי צלילים">🔊</button></div></div>
    <div class="intro"><div class="overline">💈 המשחק החדש של המספרה 💈</div><h1>מי יעוף הכי <strong>רחוק?</strong></h1><p>הפעם אבי וקוקו עפים מעל כל המכשולים!</p></div>
    <button id="startBtn" class="start" type="button">יאללה, עפים! <span aria-hidden="true">🚀</span></button>
    <div class="hintline">👇 בוחרים דמות — ואז נוגעים כדי לעוף <button type="button" class="bc-remove-inline" id="removeAdsBtn">🎁 הסר פרסומות</button></div>
  </header>
  <div class="hero-split" role="group" aria-label="בחירת ספר">
    <button class="hero avi" data-hero="avi" type="button" aria-label="שחקו עם אבי" aria-pressed="false"><span class="glow"></span><span class="wing"></span><span class="wing right"></span><span class="body"><span class="shirt"></span><span class="tie"></span></span><img class="face" alt="הפנים של אבי" id="aviFace"><span class="check">✓</span><span class="label"><strong>אבי</strong><small>ספר הנשים</small></span></button>
    <button class="hero koko" data-hero="koko" type="button" aria-label="שחקו עם קוקו" aria-pressed="true"><span class="glow"></span><span class="wing"></span><span class="wing right"></span><span class="body"><span class="shirt"></span><span class="tie"></span></span><img class="face" alt="הפנים של קוקו" id="kokoFace"><span class="check">✓</span><span class="label"><strong>קוקו</strong><small>ספר הגברים</small></span></button>
  </div>
</section>
<section id="game" class="screen" aria-label="משחק הריצה המעופפת">
  <canvas id="world" aria-label="משחק שבו עפים בין עמודי מספרה. הקישו או געו במסך כדי לעלות."></canvas>
  <div class="hud"><div class="stats"><div class="stat"><b id="score">0</b><small>מעברים</small></div><div class="stat"><b id="best">0</b><small>שיא אישי</small></div></div><div><button id="pauseBtn" type="button" aria-label="עצור את המשחק">Ⅱ</button></div></div>
  <div class="hint" id="gameHint">👆 נגיעה אחת = נפנוף כנפיים · אל תיגעו בעמודים!</div>
  <div class="tapcall" id="tapcall">👆 הקישו בכל מקום כדי להמשיך לעוף</div>
</section>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="תפריט המשחק"><div class="dialog" id="dialog"></div></div>
</div>

const faceImages={};Object.keys(FACES).forEach(k=>{const im=new Image();im.src=FACES[k];faceImages[k]=im;});
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false});
$('aviFace').src=FACES.avi;$('kokoFace').src=FACES.koko;
const STORE='flappyBarberV1';let data={choice:'koko',best:{avi:0,koko:0},sound:true};try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&typeof d==='object')data={...data,...d,best:{...data.best,...(d.best||{})}}}catch{}
let choice=data.choice==='avi'?'avi':'koko',status='home',W=390,H=800,dpr=1,frameId=0,lastTime=0,elapsed=0,bird=null,pipes=[],particles=[],score=0,spawnCounter=0,gap=210,speed=166,runId=0,audioCtx=null,hintTimer=0,resumeStatus='running';
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}};
const barberAds=window.BarberCommonAds?.create({gameId:'flappyBarber',deathsPerAd:2,durationSeconds:15,skipAfterSeconds:5,playerId:()=> 'guest'});
$('removeAdsBtn').addEventListener('click',()=>{if(barberAds)barberAds.removeAds();else alert('אין חיבור למנגנון הפרסומות. המשחק עדיין עובד כרגיל.');});
function updateChoice(){document.querySelectorAll('[data-hero]').forEach(b=>{const active=b.dataset.hero===choice;b.dataset.selected=String(active);b.setAttribute('aria-pressed',String(active));});}
document.querySelectorAll('[data-hero]').forEach(b=>b.addEventListener('click',()=>{choice=b.dataset.hero;data.choice=choice;save();updateChoice();blip(600,.06);}));updateChoice();
function blip(freq=400,seconds=.08,type='sine'){if(!data.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=audioCtx||new A();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);v.gain.setValueAtTime(.052,audioCtx.currentTime);v.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+seconds);o.connect(v);v.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+seconds)}catch{}}
function audioLabel(){$('audioBtn').textContent=data.sound?'🔊':'🔇';}$('audioBtn').addEventListener('click',()=>{data.sound=!data.sound;save();audioLabel();blip(540)});audioLabel();
function modal(html){$('dialog').innerHTML=html;$('overlay').classList.add('open');}
function hideModal(){$('overlay').classList.remove('open');$('dialog').innerHTML='';}
function showHome(){runId++;cancelAnimationFrame(frameId);status='home';$('game').classList.remove('active');$('home').classList.add('active');hideModal();updateChoice();}
function resize(){const r=canvas.getBoundingClientRect();const oldH=H;W=r.width||innerWidth;H=r.height||innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);if(bird&&oldH>0)bird.y=(bird.y/oldH)*H;}
window.addEventListener('resize',()=>{if($('game').classList.contains('active')){resize();if(status!=='running')render();}});
function start(){hideModal();$('home').classList.remove('active');$('game').classList.add('active');status='ready';resize();elapsed=0;score=0;spawnCounter=1.35;gap=Math.max(216,Math.min(265,H*.315));speed=Math.max(155,Math.min(196,W*.45));pipes=[];particles=[];bird={x:W*.30,y:H*.48,v:-160,wing:0,rot:0};$('score').textContent='0';$('best').textContent=data.best[choice]||'0';$('gameHint').classList.remove('fade');$('tapcall').classList.remove('fade');clearTimeout(hintTimer);hintTimer=setTimeout(()=>{$('gameHint').classList.add('fade');$('tapcall').classList.add('fade')},3600);lastTime=0;cancelAnimationFrame(frameId);runId++;render();blip(670,.09);}
$('startBtn').addEventListener('click',start);
function pause(){if(status!=='running'&&status!=='ready')return;resumeStatus=status;status='paused';cancelAnimationFrame(frameId);modal(`<div class="art">⏸️</div><h2>עצירה קצרה?</h2><p>${choice==='avi'?'אבי':'קוקו'} נח רגע. הריצה מחכה!</p><button data-action="resume">ממשיכים לעוף!</button><button class="secondary" data-action="home">בחירת דמות</button>`);}
function resume(){if(status!=='paused')return;hideModal();status=resumeStatus;lastTime=0;if(status==='running')frameId=requestAnimationFrame(tick);else render();}
$('pauseBtn').addEventListener('click',e=>{e.stopPropagation();pause()});
function showHelp(){modal(`<div class="art">💈</div><h2>איך עפים?</h2><p>בוחרים את אבי או קוקו, ולוחצים על ״יאללה, עפים!״. בכל נגיעה במסך הדמות קופצת למעלה. צריך לעבור בין עמודי המספרה בלי לפגוע בהם — כל מעבר שווה נקודה!</p><p class="note">מתאים לאייפון, לאנדרואיד ולמקלדת (רווח / חץ למעלה).</p><button data-action="close">הבנתי, יאללה!</button>`);}
$('helpBtn').addEventListener('click',showHelp);
$('overlay').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const x=b.dataset.action;if(x==='home')showHome();if(x==='resume')resume();if(x==='retry')start();if(x==='removeAds'){if(barberAds)barberAds.removeAds();}if(x==='close')hideModal();});
function flap(){if(status==='ready'){status='running';lastTime=0;frameId=requestAnimationFrame(tick)}if(status!=='running')return;bird.v=-Math.max(345,Math.min(410,H*.48));bird.wing=1;blip(410,.07,'triangle');if(elapsed<4){$('gameHint').classList.add('fade');$('tapcall').classList.add('fade');}}
canvas.addEventListener('pointerdown',e=>{if(status!=='running'&&status!=='ready')return;e.preventDefault();flap();});
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){if(status==='running'||status==='ready'){e.preventDefault();flap();}else if(status==='home'&&e.code==='Space'){e.preventDefault();start();}else if(status==='over'&&e.code==='Space'){e.preventDefault();start();}}if(e.key==='Escape'){if(status==='running'||status==='ready')pause();else if(status==='paused')resume();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(status==='running'||status==='ready'))pause()});
const rand=(a,b)=>a+Math.random()*(b-a);
function spawnPipe(){const safeTop=Math.max(142,H*.22);const safeBottom=Math.max(155,H*.21);const lo=safeTop+gap/2,hi=H-safeBottom-gap/2;const center=lo<hi?(score<3?Math.max(lo,Math.min(hi,H*.49+rand(-28,28))):rand(lo,hi)):H*.5;pipes.push({x:W+80,center,scored:false,seed:Math.random()*10});}
function update(dt){elapsed+=dt;bird.v+=980*dt;bird.v=Math.min(520,bird.v);bird.y+=bird.v*dt;bird.wing=Math.max(0,bird.wing-dt*4);bird.rot=Math.max(-.36,Math.min(.73,bird.v/600));const level=Math.floor(score/7);speed=Math.max(155,Math.min(250,W*.45))+Math.min(65,level*10);gap=score<3?Math.max(216,Math.min(265,H*.315)):Math.max(174,Math.min(220,H*.265)-level*6);spawnCounter-=dt;if(spawnCounter<=0){spawnPipe();spawnCounter=Math.max(1.15,Math.min(1.55,W/Math.max(speed,1)*.93));}const radius=Math.max(24,Math.min(33,W*.075));for(const p of pipes){p.x-=speed*dt;const width=Math.max(66,Math.min(82,W*.18)),top=p.center-gap/2,bottom=p.center+gap/2;const horizontal=bird.x+radius>p.x+5&&bird.x-radius<p.x+width-5;if(horizontal&&(bird.y-radius<top+6||bird.y+radius>bottom-6))return gameOver();if(!p.scored&&p.x+width<bird.x-radius){p.scored=true;score++;$('score').textContent=score;blip(700+Math.min(score,15)*28,.08,'triangle');if(score>data.best[choice]){data.best[choice]=score;save();$('best').textContent=score;}for(let i=0;i<10;i++)particles.push({x:bird.x+36,y:bird.y,vx:rand(-90,85),vy:rand(-110,90),life:rand(.3,.8),c:Math.random()>.5?'#ffe8a5':'#7edce5'});}}
pipes=pipes.filter(p=>p.x>-110);for(const a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;}particles=particles.filter(p=>p.life>0);if(bird.y<37||bird.y>H-53)return gameOver();}
function gameOver(){status='over';cancelAnimationFrame(frameId);blip(170,.21,'sawtooth');data.best[choice]=Math.max(score,data.best[choice]||0);save();const record=score>0&&score===data.best[choice];modal(`<div class="art">${score>=10?'🏆':'💈'}</div><h2>${score>=10?'איזה טיסה!':'אופס, הסתפרנו בדרך!'}</h2><p>${choice==='avi'?'אבי':'קוקו'} עבר ${score===1?'מכשול אחד':score+' מכשולים'}. עוד ניסיון לשבור את השיא?</p><div class="scorebig">${score}</div><div class="row"><span>הניקוד שלך<b>${score}</b></span><span>השיא עם ${choice==='avi'?'אבי':'קוקו'}<b>${data.best[choice]||0}</b></span></div>${record&&score>1?'<p class="note">✨ שיא חדש! ✨</p>':''}<button data-action="retry">⚡ עוד סיבוב!</button><button data-action="home" class="secondary">🔄 לבחור ספר אחר</button><button data-action="removeAds" class="secondary">🎁 הסר פרסומות בחינם</button>`);if(barberAds)barberAds.recordGameOver();}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function backdrop(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17263d');sky.addColorStop(.49,'#263953');sky.addColorStop(.72,'#4a3447');sky.addColorStop(1,'#282339');rect(0,0,W,H,sky);const off=(elapsed*speed*.28)%220;
// warmly lit barber-shop mirrors, moving slowly behind the obstacles
for(let i=-1;i<Math.ceil(W/190)+2;i++){const x=i*190-off;rounded(x+18,H*.19,119,H*.53,20,'#101a31','#b9996d');rounded(x+25,H*.20,105,H*.51,16,'#28445a','#f7ca855c');ctx.save();ctx.globalAlpha=.14;ctx.fillStyle='#9bd0e5';ctx.beginPath();ctx.moveTo(x+47,H*.21);ctx.lineTo(x+65,H*.21);ctx.lineTo(x+116,H*.70);ctx.lineTo(x+98,H*.70);ctx.closePath();ctx.fill();ctx.restore();rounded(x+72,H*.77,14,H*.16,4,'#e8c992','#614a35');rounded(x+44,H*.76,73,12,6,'#17223c','#e9bd6d');}
rect(0,0,W,H*.15,'#0e1726aa');rect(0,H*.91,W,H*.09,'#101a2e');for(let i=0;i<16;i++){const x=((i*82-(elapsed*speed*.58)%82)+W+83)%(W+166)-83;rect(x,H*.925,43,3,'#f4c47a38');}
for(let i=0;i<5;i++){const x=((i*183-(elapsed*speed*.20)%183)+W+183)%(W+240)-100;ctx.font='23px system-ui';ctx.fillStyle='#f7cf7a70';ctx.fillText('✂',x,H*.11);} }
function barberPole(x,y,w,h,isTop){if(h<=0)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();rounded(x+4,y,w-8,h,10,'#efe5d6','#eccb9a');ctx.save();ctx.beginPath();ctx.rect(x+7,y,w-14,h);ctx.clip();for(let k=-H*1.5;k<H*2;k+=47){const py=k+(elapsed*65)%47;ctx.beginPath();ctx.moveTo(x+4,py);ctx.lineTo(x+w+9,py+34);ctx.lineTo(x+w+9,py+50);ctx.lineTo(x+4,py+16);ctx.closePath();ctx.fillStyle=(Math.floor(k/47)&1)?'#db4f58':'#3474a4';ctx.fill();}ctx.restore();rect(x+7,y+3,6,h-6,'#ffffff6b');rect(x+w-13,y+3,5,h-6,'#1c31512f');ctx.restore();const lipH=25,lipY=isTop?y+h-lipH:y;rounded(x-5,lipY,w+10,lipH,8,'#172c47','#f9dca5');rect(x-1,lipY+5,w+2,3,'#f9dca583');const icon='✂';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillStyle='#f3d49c';ctx.fillText(icon,x+w/2,lipY+18);}
function drawPipes(){const pw=Math.max(66,Math.min(82,W*.18));for(const p of pipes){const top=p.center-gap/2,bottom=p.center+gap/2;barberPole(p.x,0,pw,top,true);barberPole(p.x,bottom,pw,H-bottom,false);
const starX=p.x+pw*.5,starY=p.center;ctx.save();ctx.globalAlpha=.45+.22*Math.sin(elapsed*3+p.seed);ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillText('✨',starX,starY+7);ctx.restore();}}
function avatar(){if(!bird)return;const k=choice==='koko';const x=bird.x,y=bird.y;const sz=Math.max(.85,Math.min(1.18,W/390));ctx.save();ctx.translate(x,y);ctx.rotate(bird.rot*.46);ctx.scale(sz,sz);
ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#07121c';ctx.beginPath();ctx.ellipse(2,52,47,9,0,0,Math.PI*2);ctx.fill();ctx.restore();
// small flying suit and animated wings
for(const side of [-1,1]){ctx.save();ctx.translate(side*23,7);const angle=side*(.3+Math.sin(elapsed*22)*.30+bird.wing*.35);ctx.rotate(angle);ctx.fillStyle='#ffe3ad';ctx.strokeStyle='#a87d4d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(side*24,1,34,17,side*.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();}
rounded(-26,5,54,57,18,k?'#294c84':'#267777','#fce7b755');ctx.fillStyle='#f6f0e5';ctx.beginPath();ctx.moveTo(-12,8);ctx.lineTo(14,8);ctx.lineTo(0,45);ctx.closePath();ctx.fill();ctx.fillStyle=k?'#e54556':'#f3c776';ctx.beginPath();ctx.moveTo(-4,9);ctx.lineTo(4,9);ctx.lineTo(7,39);ctx.lineTo(0,48);ctx.lineTo(-7,39);ctx.closePath();ctx.fill();
const im=faceImages[choice];if(im.complete&&im.naturalWidth){const faceH=k?77:71;const faceW=k?62:66;ctx.drawImage(im,-faceW/2,-faceH+13,faceW,faceH)}else{ctx.font='53px system-ui';ctx.fillText('😎',-32,-3)}
ctx.restore();}
function drawParticles(dt){for(const p of particles){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.7));rect(p.x,p.y,4,4,p.c);}ctx.globalAlpha=1;}
function render(){if(!ctx||!bird)return;backdrop();drawPipes();avatar();drawParticles();}
function tick(time){if(status!=='running')return;if(!lastTime)lastTime=time;const dt=Math.min(.04,(time-lastTime)/1000);lastTime=time;update(dt);render();if(status==='running')frameId=requestAnimationFrame(tick);}
})();
</script>
</body>
</html>
